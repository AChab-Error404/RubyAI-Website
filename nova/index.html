<!doctype html>
<html lang="fr" data-theme="ruby">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#131315" id="theme-color-meta">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RubyAI Nova — Démo Web</title>
  <link rel="icon" href="../assets/RubyLogo.png">
  <link rel="stylesheet" href="universe.css">
</head>
<body class="nova-body">
  <!-- Icônes (sprite SVG local, aucune ressource externe) -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pen-square" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 1 1 3 3L12 15l-4 1 1-4Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M3 21v-5h5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></symbol>
    <symbol id="i-diamond" viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></symbol>
    <symbol id="i-eject" viewBox="0 0 24 24"><path d="m5 14 7-9 7 9z"/><path d="M5 19h14"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="m15 4 5 5M3 21l12-12M14 2v2M20 8h2M17 3l1-1M21 7l1-1"/></symbol>
  </svg>

  <div class="nova-shell" id="nova-shell">
    <div class="nova-backdrop" id="nova-backdrop" aria-hidden="true"></div>

    <!-- Barre latérale -->
    <aside class="nova-sidebar" id="nova-sidebar" aria-label="Historique des conversations">
      <div class="nova-side-head">
        <a class="nova-brand" href="./" aria-label="RubyAI Nova — accueil">
          <img src="../assets/RubyLogo.png" alt="" width="26" height="26">
          <span class="nova-brand-name">RubyAI <em>Nova</em></span>
        </a>
        <button class="icon-btn" id="new-chat" type="button" title="Nouvelle discussion (Alt+N)" aria-label="Nouvelle discussion">
          <svg class="i"><use href="#i-pen-square"/></svg>
        </button>
      </div>

      <button class="nova-side-item nova-new-chat" id="new-chat-main" type="button" title="Nouvelle discussion (Alt+N)">
        <svg class="i"><use href="#i-plus"/></svg>
        <span>Nouvelle discussion</span>
        <kbd>Alt N</kbd>
      </button>

      <label class="nova-search">
        <svg class="i"><use href="#i-search"/></svg>
        <span class="sr-only">Rechercher une discussion</span>
        <input id="conv-search-input" type="search" placeholder="Rechercher" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>

      <div class="nova-side-label">Discussions</div>
      <nav class="nova-conv-list" id="conversation-list" aria-label="Discussions"></nav>

      <div class="nova-side-foot">
        <a class="nova-engine" href="../connect.html">
          <span class="nova-engine-text"><strong>Installations Ruby</strong></span>
        </a>
        <div class="nova-side-actions">
          <button class="icon-btn" id="open-settings" type="button" title="Réglages" aria-label="Réglages">
            <svg class="i"><use href="#i-settings"/></svg>
          </button>
          <button class="icon-btn danger" id="clear-history" type="button" title="Effacer tout l'historique" aria-label="Effacer tout l'historique">
            <svg class="i"><use href="#i-trash"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Zone principale -->
    <main class="nova-main" id="view-chat">
      <header class="nova-topbar">
        <div class="nova-topbar-left">
          <button class="icon-btn" id="toggle-sidebar" type="button" aria-expanded="true" title="Afficher / masquer l'historique (Ctrl+B)" aria-label="Basculer la barre latérale">
            <svg class="i"><use href="#i-sidebar"/></svg>
          </button>
        </div>

        <div class="nova-topbar-right">
          <span class="pill">Démo publique</span>
          <button class="icon-btn" id="download-chat" type="button" title="Télécharger la discussion (.md)" aria-label="Télécharger la discussion">
            <svg class="i"><use href="#i-download"/></svg>
          </button>
          <button class="icon-btn" id="export-chat" type="button" title="Copier toute la discussion" aria-label="Copier la discussion">
            <svg class="i"><use href="#i-copy"/></svg>
          </button>
          <button class="icon-btn" id="clear-chat" type="button" title="Vider cette discussion" aria-label="Vider cette discussion">
            <svg class="i"><use href="#i-trash"/></svg>
          </button>
        </div>
      </header>

      <div class="nova-scroll" id="chat-scroll-area">
        <section class="nova-welcome" id="welcome">
          <button class="nova-mascot" id="mascot-home" type="button" title="Une astuce ?">
            <img src="../assets/mascot/RubyMascotIdle.png" alt="Ruby" width="72" height="72">
          </button>
          <h1>Comment puis-je t'aider&nbsp;?</h1>
          <p class="nova-welcome-sub" id="mascot-hint">Essaie l’interface Web de Nova avec des réponses d’exemple.</p>

          <div class="nova-starters suggestions" aria-label="Suggestions">
            <button type="button" class="nova-starter" data-prompt="Explique-moi clairement comment fonctionne l'attention dans un modèle Transformer moderne.">
              <svg class="i"><use href="#i-bulb"/></svg>
              <span><strong>Comprendre un concept</strong><small>L'attention dans un Transformer</small></span>
            </button>
            <button type="button" class="nova-starter" data-prompt="Rédige une architecture propre en Python pour une file de tâches asynchrone avec gestion d'erreurs.">
              <svg class="i"><use href="#i-code"/></svg>
              <span><strong>Écrire du code</strong><small>File de tâches asynchrone en Python</small></span>
            </button>
            <button type="button" class="nova-starter" data-prompt="Explique comment lire un relevé de performances du PC.">
              <svg class="i"><use href="#i-cpu"/></svg>
              <span><strong>Lire les performances du PC</strong><small>CPU, GPU, VRAM, RAM et disques</small></span>
            </button>
            <button type="button" class="nova-starter" data-prompt="Compare les avantages de Sun (4B), Adara (9B) et Buna (12B) et dis-moi quand utiliser chacun.">
              <svg class="i"><use href="#i-layers"/></svg>
              <span><strong>Choisir un modèle</strong><small>Sun, Adara ou Buna ?</small></span>
            </button>
          </div>
        </section>

        <div class="nova-thread" id="messages" aria-live="polite"></div>

      </div>

      <div class="nova-composer-wrap">
        <form class="nova-composer" id="composer">
          <label class="sr-only" for="prompt-input">Message pour Nova</label>
          <textarea id="prompt-input" rows="1" maxlength="4000" placeholder="Écris à Nova…"></textarea>
          <div class="nova-composer-bar">
            <div class="nova-composer-tools"><span class="composer-model">Réponses d’exemple</span></div>
            <div class="nova-composer-submit">
              <span class="composer-count" id="composer-char-count">0 / 4000</span>
              <button class="send-btn" id="send-button" type="submit" title="Envoyer (Entrée)" aria-label="Envoyer">
                <svg class="i"><use href="#i-arrow-up"/></svg>
              </button>
            </div>
          </div>
        </form>
        <p class="nova-footnote">Les discussions de cette démo sont enregistrées dans ce navigateur.</p>
      </div>
    </main>
  </div>

  <!-- Dialogue intégré de saisie (renommer une discussion / modifier un message) -->
  <dialog class="nova-dialog nova-prompt-modal" id="nova-prompt-dialog" aria-labelledby="nova-prompt-title">
    <form method="dialog" class="nova-dialog-card" id="nova-prompt-form">
      <header class="nova-dialog-head">
        <h2 id="nova-prompt-title">Modifier</h2>
        <button class="icon-btn" id="nova-prompt-close" type="button" aria-label="Fermer">
          <svg class="i"><use href="#i-x"/></svg>
        </button>
      </header>
      <section class="nova-dialog-section">
        <label class="nova-prompt-field" for="nova-prompt-input">
          <span id="nova-prompt-label">Valeur</span>
          <textarea id="nova-prompt-input" rows="3" maxlength="4000"></textarea>
        </label>
      </section>
      <footer class="nova-dialog-foot">
        <button class="btn btn-ghost" id="nova-prompt-cancel" type="button">Annuler</button>
        <button class="btn btn-primary" id="nova-prompt-submit" type="submit">Enregistrer</button>
      </footer>
    </form>
  </dialog>

  <!-- Réglages & état système -->
  <dialog class="nova-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="nova-dialog-card">
      <header class="nova-dialog-head">
        <h2 id="settings-title">Réglages</h2>
        <button class="icon-btn" value="close" aria-label="Fermer">
          <svg class="i"><use href="#i-x"/></svg>
        </button>
      </header>

      <section class="nova-dialog-section">
        <h3>Apparence</h3>
        <div class="nova-themes" role="radiogroup" aria-label="Thème">
          <label class="nova-theme"><input type="radio" name="theme" value="ruby" checked><span class="swatch sw-ruby"></span><span>Ruby</span></label>
          <label class="nova-theme"><input type="radio" name="theme" value="dark"><span class="swatch sw-dark"></span><span>Obsidian</span></label>
          <label class="nova-theme"><input type="radio" name="theme" value="light"><span class="swatch sw-light"></span><span>Clair</span></label>
          <label class="nova-theme"><input type="radio" name="theme" value="faye"><span class="swatch sw-faye"></span><span>Ambre</span></label>
        </div>
      </section>

      <footer class="nova-dialog-foot">
        <button class="btn btn-primary" value="close">Terminé</button>
      </footer>
    </form>
  </dialog>

  <script src="safe-render.js"></script>
  <script src="nova.js"></script>
</body>
</html>
